<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Дорамы · график серий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #120e1b;      /* фон */
    --panel: #1b1527;      /* карточки */
    --panel2: #241c33;     /* поля, плашки */
    --line: #33284a;
    --moon: #ece6f7;       /* основной текст */
    --mist: #9d92b5;       /* второстепенный текст */
    --peony: #ff8fb4;      /* главный акцент */
    --lilac: #b9a6ff;      /* второй акцент */
    --ok: #7fe3b0; --bad: #ff7d7d;
    --display: "Unbounded", "Onest", system-ui, sans-serif;
    --text: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0; color: var(--moon); font: 16px/1.5 var(--text);
    background:
      radial-gradient(900px 500px at 85% -120px, rgba(185,166,255,.14), transparent 70%),
      radial-gradient(700px 420px at -10% 10%, rgba(255,143,180,.08), transparent 70%),
      var(--night);
    min-height: 100vh;
  }
  main { max-width: 940px; margin: 0 auto; padding: 22px 18px 120px; }
  a { color: var(--lilac); }
  h1, h2, h3 { font-family: var(--display); font-weight: 500; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 19px; margin-bottom: 14px; }
  :focus-visible { outline: 2px solid var(--peony); outline-offset: 2px; border-radius: 6px; }

  /* шапка */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  .top h1 { font-size: 22px; }
  .btn { font: inherit; font-weight: 500; color: var(--moon); background: var(--panel2); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 12px; cursor: pointer; transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--lilac); }
  .btn.main { background: var(--peony); color: #2a0f1b; border-color: var(--peony); font-weight: 600; }
  .btn.main:hover { background: #ffa3c1; }
  .btn.small { padding: 6px 11px; font-size: 14px; border-radius: 9px; }
  .btn.ghost { background: transparent; }

  /* главный экран: следующая серия */
  .hero { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 26px;
    padding: 34px 30px 32px; margin-bottom: 26px;
    background: linear-gradient(160deg, #221a33 0%, #181222 70%); }
  .hero .moon { position: absolute; right: 26px; top: 22px; width: 118px; height: 118px; border-radius: 50%;
    box-shadow: inset -30px -8px 0 0 var(--moon); filter: drop-shadow(0 0 26px rgba(185,166,255,.45)); opacity: .95; }
  .hero .lead { color: var(--mist); margin: 0 0 6px; }
  .hero .name { font-size: clamp(22px, 5vw, 34px); max-width: 15em; margin-bottom: 18px; line-height: 1.2; }
  .hero .when { font-family: var(--display); font-weight: 700; color: var(--peony); font-size: clamp(30px, 7vw, 52px); line-height: 1.1; }
  .hero .at { color: var(--mist); margin-top: 10px; }
  .hero.empty .name { margin-bottom: 8px; }

  /* подписка */
  .sub { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; margin-bottom: 30px; }
  .sub p { margin: 0; color: var(--mist); font-size: 14px; max-width: 46em; }
  .sub b { color: var(--moon); font-weight: 500; }
  code { background: var(--panel2); border-radius: 6px; padding: 2px 7px; font-size: 13px; word-break: break-all; }

  /* ближайшие серии */
  section { margin-bottom: 34px; }
  .day { margin-bottom: 14px; }
  .day h3 { font-size: 14px; color: var(--lilac); margin-bottom: 6px; font-family: var(--text); font-weight: 600; }
  .row { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; margin-bottom: 6px;
    background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--lilac)); border-radius: 12px; }
  .row .t { color: var(--mist); min-width: 48px; font-variant-numeric: tabular-nums; }
  .row .n { flex: 1; }
  .row .e { color: var(--mist); font-size: 14px; white-space: nowrap; }

  /* сериалы */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
  .card h3 { font-size: 16px; line-height: 1.3; margin: 4px 0 6px; font-family: var(--text); font-weight: 600; }
  .meta { color: var(--mist); font-size: 14px; }
  .bar { height: 7px; background: var(--panel2); border-radius: 9px; margin: 14px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c); border-radius: 9px; }
  .prog { font-size: 14px; color: var(--moon); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 12px 0; }
  .chip { font-size: 12.5px; background: var(--panel2); border-radius: 7px; padding: 2px 8px; color: var(--moon); white-space: nowrap; }
  .chip.past { opacity: .4; }
  .links { font-size: 14px; display: flex; gap: 12px; margin-bottom: 12px; }
  .acts { display: flex; gap: 8px; }
  .hint { color: var(--mist); font-size: 14px; }

  /* окно добавления */
  dialog { color: var(--moon); background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 0;
    width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
  dialog::backdrop { background: rgba(8,5,14,.72); backdrop-filter: blur(4px); }
  .dlg { padding: 24px 24px 20px; }
  .dlg h2 { margin-bottom: 4px; }
  label { display: block; font-size: 13.5px; color: var(--mist); margin: 14px 0 5px; }
  input[type=text], input[type=url], input[type=number], input[type=date], input[type=time], input[type=password], textarea {
    width: 100%; font: inherit; color: var(--moon); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 11px; padding: 10px 12px; color-scheme: dark; }
  input:focus, textarea:focus { outline: none; border-color: var(--peony); box-shadow: 0 0 0 3px rgba(255,143,180,.18); }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .days { display: flex; flex-wrap: wrap; gap: 7px; }
  .days label { margin: 0; color: var(--moon); }
  .days input { position: absolute; opacity: 0; pointer-events: none; }
  .days span { display: inline-block; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; }
  .days input:checked + span { background: var(--lilac); color: #1a1030; border-color: var(--lilac); font-weight: 600; }
  .days input:focus-visible + span { outline: 2px solid var(--peony); outline-offset: 2px; }
  details summary { cursor: pointer; color: var(--lilac); margin-top: 14px; }
  .preview { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 14px; max-height: 120px; overflow: auto; }
  .dlg-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* панель сохранения */
  .savebar { position: fixed; left: 12px; right: 12px; bottom: 12px; max-width: 760px; margin: 0 auto;
    background: #2a2040; border: 1px solid var(--lilac); border-radius: 16px; padding: 12px 14px 12px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .savebar[hidden] { display: none; }
  .savebar span.ok { color: var(--ok); } .savebar span.bad { color: var(--bad); }
  footer { color: var(--mist); font-size: 14px; }
  footer .box { margin-top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 4px 18px 18px; }
  .ra { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .row { align-items: center; }
  .hero .ra { margin: 18px 0 0; }
  .edits { margin: 4px 0 10px; }
  .chip button { background: none; border: 0; color: var(--mist); cursor: pointer; padding: 0 0 0 5px; font: inherit; }
  .chip button:hover { color: var(--peony); }
  @media (max-width: 520px) { .ra { width: 100%; margin-left: 60px; } .hero { padding: 26px 20px; } .hero .moon { width: 70px; height: 70px; right: 16px; top: 16px; box-shadow: inset -18px -5px 0 0 var(--moon); }
    .row { flex-wrap: wrap; } .row .e { width: 100%; padding-left: 60px; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Дорамы</h1>
    <button class="btn main" id="addBtn" type="button">Добавить сериал</button>
  </div>

  <div class="hero" id="hero"></div>

  <div class="sub" id="subCard"></div>

  <section>
    <h2>Ближайшие серии</h2>
    <div id="upcoming"></div>
  </section>

  <section>
    <h2>Мои сериалы</h2>
    <div class="grid" id="list"></div>
  </section>

  <footer>
    <details><summary>Настройки сохранения</summary>
      <div class="box">
        <label>Репозиторий на GitHub</label><input type="text" id="ghRepo" placeholder="логин/drama-tracker" autocomplete="off">
        <label>Токен доступа (хранится только в этом браузере)</label><input type="password" id="ghToken" autocomplete="off">
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn small" id="ghSave" type="button">Запомнить</button>
          <button class="btn small ghost" id="dl" type="button">Скачать shows.json</button>
        </div>
        <p class="hint" id="cfgStatus"></p>
      </div>
    </details>
  </footer>
</main>

<div class="savebar" id="savebar" hidden>
  <span id="status">Есть несохранённые изменения</span>
  <button class="btn main" id="pushBtn" type="button">Сохранить и обновить календарь</button>
</div>

<dialog id="dlg">
  <form id="f" class="dlg">
    <h2 id="formTitle">Новый сериал</h2>
    <label>Название</label>
    <input type="text" id="title" required>
    <div class="two">
      <div><label>Ссылка на MyDramaList</label><input type="url" id="mdl" placeholder="https://mydramalist.com/..."></div>
      <div><label>Ссылка на MyAsianTV</label><input type="url" id="atv" placeholder="https://ww19.myasiantv.es/tv/..."></div>
    </div>
    <div class="two">
      <div><label>Дата премьеры</label><input type="date" id="start" required></div>
      <div><label>Время выхода (по Минску)</label><input type="time" id="time" value="20:00" required></div>
      <div><label>Всего серий</label><input type="number" id="total" min="1" max="200" required></div>
    </div>
    <label>Дни недели, когда выходят серии</label>
    <div class="days" id="days"></div>
    <div class="two">
      <div><label>Серий в день премьеры</label><input type="number" id="batch" min="1" value="1"></div>
      <div><label>Серий в обычный день выхода</label><input type="number" id="perday" min="1" value="1"></div>
    </div>
    <details><summary>Перерыв или перенос серии</summary>
      <label>Пропущенные даты выхода (по одной в строке, ГГГГ-ММ-ДД). Остальные серии сдвинутся.</label>
      <textarea id="skip" rows="2"></textarea>
      <label>Другая дата или время для конкретной серии («5 2026-12-04» или «5 2026-12-04 21:30»)</label>
      <textarea id="ovr" rows="2"></textarea>
    </details>
    <p class="hint">Если дни недели не выбраны, серии выходят в тот же день недели, что и премьера.</p>
    <div class="preview" id="preview"></div>
    <div class="dlg-foot">
      <button class="btn ghost" type="button" id="cancel">Отмена</button>
      <button class="btn main" type="submit" id="saveBtn">Добавить</button>
    </div>
  </form>
</dialog>

<dialog id="mv">
  <form id="mvf" class="dlg">
    <h2 id="mvTitle">Перенести серию</h2>
    <div class="two">
      <div><label>Новая дата</label><input type="date" id="mvDate" required></div>
      <div><label>Время (по Минску)</label><input type="time" id="mvTime" required></div>
    </div>
    <p class="hint">Меняется только эта серия, остальные остаются как были.</p>
    <div class="dlg-foot">
      <button class="btn ghost" type="button" id="mvReset">Вернуть по графику</button>
      <button class="btn ghost" type="button" id="mvCancel">Отмена</button>
      <button class="btn main" type="submit">Перенести</button>
    </div>
  </form>
</dialog>

<script src="lib.js"></script>
<script>
const { generateEpisodes, fmtDate } = DramaLib;
const $ = (id) => document.getElementById(id);
const DAYN = ['вс','пн','вт','ср','чт','пт','сб'];
const DAYFULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const MONTH = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const ORDER = [1,2,3,4,5,6,0];
const TZ = 3; // Минск, UTC+3
let shows = [], editing = null, dirty = false;

const ls = {
  get: (k) => { try { return localStorage.getItem(k) } catch { return null } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch {} },
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, f) => f[(n % 10 === 1 && n % 100 !== 11) ? 0 : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 1 : 2];
const hueOf = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
const colorOf = (s) => `hsl(${hueOf(s.id + s.title)} 78% 72%)`;

// момент выхода серии (в мс, UTC)
function epMs(show, e) {
  const [y, m, d] = e.date.split('-').map(Number);
  const [hh, mm] = (e.time || show.time || '20:00').split(':').map(Number);
  return Date.UTC(y, m - 1, d, hh - TZ, mm);
}
const minskNow = () => new Date(Date.now() + TZ * 3600e3);
const todayStr = () => fmtDate(minskNow());
function dayLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  const diff = Math.round((d - new Date(todayStr() + 'T00:00:00Z')) / 864e5);
  const base = `${DAYFULL[d.getUTCDay()]}, ${d.getUTCDate()} ${MONTH[d.getUTCMonth()]}`;
  return diff === 0 ? 'Сегодня · ' + base : diff === 1 ? 'Завтра · ' + base : base;
}
function short(dateStr) { const d = new Date(dateStr + 'T00:00:00Z'); return `${DAYN[d.getUTCDay()]} ${d.getUTCDate()}.${String(d.getUTCMonth() + 1).padStart(2, '0')}`; }

function allEpisodes() {
  const out = [];
  shows.forEach(s => generateEpisodes(s).forEach(e => out.push({ s, e, ms: epMs(s, e) })));
  return out.sort((a, b) => a.ms - b.ms);
}

// ---------- главный экран ----------
function renderHero() {
  const now = Date.now(), next = allEpisodes().find(x => x.ms >= now - 3 * 3600e3);
  if (!next) {
    $('hero').className = 'hero empty';
    $('hero').innerHTML = `<div class="moon"></div><p class="lead">Следующая серия</p>
      <h2 class="name">Пока ничего не запланировано</h2><p class="hint">Добавьте сериал, и здесь появится отсчёт до ближайшей серии.</p>`;
    return;
  }
  const diff = next.ms - now;
  let when;
  if (diff <= 0) when = 'Выходит сейчас';
  else {
    const min = Math.floor(diff / 60000), d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
    const dd = `${d} ${plural(d, ['день','дня','дней'])}`;
    when = 'Через ' + (d > 0 ? (h > 0 ? `${dd} ${h} ч` : dd) : h > 0 ? `${h} ч ${m} мин` : `${Math.max(m, 1)} мин`);
  }
  $('hero').className = 'hero';
  $('hero').innerHTML = `<div class="moon"></div><p class="lead">Следующая серия</p>
    <h2 class="name">${esc(next.s.title)}</h2>
    <div class="when">${when}</div>
    <div class="at">Серия ${next.e.n} · ${dayLabel(next.e.date)}, в ${next.e.time || next.s.time}</div>
    ${epButtons(next.s.id, next.e.n)}`;
}
const epButtons = (id, n) => `<span class="ra"><button class="btn small ghost" data-skip="${id}|${n}">Не выйдет</button><button class="btn small ghost" data-move="${id}|${n}">Перенести</button></span>`;

// ---------- подписка ----------
function renderSub() {
  const host = location.host, path = location.pathname.replace(/[^/]*$/, '');
  if (!/github\.io$/.test(host)) {
    $('subCard').innerHTML = '<p>Ссылка для календаря появится, когда страница будет опубликована на GitHub Pages.</p>'; return;
  }
  const web = `webcal://${host}${path}calendar.ics`;
  $('subCard').innerHTML = `<p><b>Календарь на Маке и iPhone.</b> Один раз: Календарь → Файл → Новая подписка на календарь → вставьте <code>${web}</code>. Напоминание приходит за час до серии.</p>
    <a href="${web}"><button class="btn small" type="button">Подписаться</button></a>`;
}

// ---------- списки ----------
function renderUpcoming() {
  const t = todayStr(), items = allEpisodes().filter(x => x.e.date >= t).slice(0, 14);
  if (!items.length) { $('upcoming').innerHTML = '<p class="hint">Здесь появятся ближайшие серии.</p>'; return; }
  let html = '', cur = '';
  for (const x of items) {
    if (x.e.date !== cur) { if (cur) html += '</div>'; cur = x.e.date; html += `<div class="day"><h3>${dayLabel(cur)}</h3>`; }
    html += `<div class="row" style="--c:${colorOf(x.s)}"><span class="t">${x.e.time || x.s.time}</span>
      <span class="n">${esc(x.s.title)}</span><span class="e">серия ${x.e.n} из ${x.s.totalEpisodes}</span>${epButtons(x.s.id, x.e.n)}</div>`;
  }
  $('upcoming').innerHTML = html + '</div>';
}
function renderList() {
  if (!shows.length) { $('list').innerHTML = '<p class="hint">Список пуст. Нажмите «Добавить сериал».</p>'; return; }
  const now = Date.now();
  $('list').innerHTML = shows.map(s => {
    const eps = generateEpisodes(s), aired = eps.filter(e => epMs(s, e) <= now).length, tot = eps.length || 1;
    const nextEps = eps.filter(e => epMs(s, e) > now).slice(0, 4);
    const days = (s.weekdays && s.weekdays.length ? ORDER.filter(d => s.weekdays.includes(d)) : []).map(d => DAYN[d]).join(', ');
    const edits = [
      ...(s.skipDates || []).map(d => `<span class="chip">пропуск ${short(d)}<button data-us="${s.id}|${d}" aria-label="Убрать пропуск">✕</button></span>`),
      ...Object.entries(s.overrides || {}).map(([n, v]) => `<span class="chip">серия ${esc(n)} → ${esc(v)}<button data-uo="${s.id}|${n}" aria-label="Убрать перенос">✕</button></span>`),
    ];
    return `<article class="card" style="--c:${colorOf(s)}">
      <h3>${esc(s.title)}</h3>
      <div class="meta">${eps.length} ${plural(eps.length, ['серия','серии','серий'])}${days ? ' · ' + days : ''} · в ${esc(s.time)}</div>
      <div class="bar"><i style="width:${Math.round(aired / tot * 100)}%"></i></div>
      <div class="prog">${aired >= eps.length && eps.length ? 'Все серии вышли' : `Вышло ${aired} из ${eps.length}`}</div>
      <div class="chips">${nextEps.map(e => `<span class="chip">${e.n}: ${short(e.date)}</span>`).join('') || ''}</div>
      ${edits.length ? `<div class="edits"><div class="meta">Правки графика</div><div class="chips">${edits.join('')}</div></div>` : ''}
      <div class="links">${s.mdlUrl ? `<a href="${esc(s.mdlUrl)}" target="_blank" rel="noopener">MyDramaList</a>` : ''}${s.asiantvUrl ? `<a href="${esc(s.asiantvUrl)}" target="_blank" rel="noopener">MyAsianTV</a>` : ''}</div>
      <div class="acts"><button class="btn small" data-e="${s.id}">Изменить</button><button class="btn small ghost" data-d="${s.id}">Удалить</button></div>
    </article>`;
  }).join('');
}
function renderAll() { renderHero(); renderUpcoming(); renderList(); }
setInterval(renderHero, 60000);

// ---------- форма ----------
$('days').innerHTML = ORDER.map(d => `<label><input type="checkbox" value="${d}"><span>${DAYN[d]}</span></label>`).join('');
$('ghRepo').value = ls.get('ghRepo') || ''; $('ghToken').value = ls.get('ghToken') || '';

function readForm() {
  const ovr = {};
  $('ovr').value.split('\n').map(s => s.trim()).filter(Boolean).forEach(l => {
    const m = l.match(/^(\d+)\s+(\d{4}-\d{2}-\d{2}(?:\s+\d{1,2}:\d{2})?)$/); if (m) ovr[m[1]] = m[2];
  });
  return {
    id: editing || 's' + Date.now().toString(36),
    title: $('title').value.trim(), mdlUrl: $('mdl').value.trim(), asiantvUrl: $('atv').value.trim(),
    startDate: $('start').value, time: $('time').value || '20:00', totalEpisodes: +$('total').value || 0,
    weekdays: [...document.querySelectorAll('#days input:checked')].map(i => +i.value),
    premiereBatch: +$('batch').value || 1, perDay: +$('perday').value || 1,
    skipDates: $('skip').value.split('\n').map(s => s.trim()).filter(s => /^\d{4}-\d{2}-\d{2}$/.test(s)),
    overrides: ovr,
  };
}
function renderPreview() {
  const s = readForm(), t = todayStr();
  $('preview').innerHTML = s.startDate && s.totalEpisodes
    ? generateEpisodes(s).map(e => `<span class="chip ${e.date < t ? 'past' : ''}">${e.n}: ${short(e.date)}${e.time ? ' ' + e.time : ''}</span>`).join('') : '';
}
['title','start','time','total','batch','perday','skip','ovr'].forEach(i => $(i).addEventListener('input', renderPreview));
$('days').addEventListener('change', renderPreview);

function resetForm() {
  editing = null; $('f').reset(); $('time').value = '20:00'; $('batch').value = 1; $('perday').value = 1;
  $('formTitle').textContent = 'Новый сериал'; $('saveBtn').textContent = 'Добавить'; renderPreview();
}
$('addBtn').onclick = () => { resetForm(); $('dlg').showModal(); };
$('cancel').onclick = () => $('dlg').close();
// ---------- правки графика «в моменте» ----------
const epOf = (id, n) => { const s = shows.find(x => x.id === id); return { s, e: generateEpisodes(s).find(x => x.n == n) }; };
function nextReleaseDate(s, from) {
  const base = DramaLib.parseDate(from), wd = s.weekdays && s.weekdays.length ? s.weekdays.map(Number) : [base.getUTCDay()];
  for (let i = 1; i <= 14; i++) { const d = new Date(base.getTime() + i * 864e5); if (wd.includes(d.getUTCDay())) return fmtDate(d); }
  return from;
}
function skipEpisode(id, n) {
  const { s, e } = epOf(id, n);
  if (!confirm(`«${s.title}», серия ${n} не выйдет ${dayLabel(e.date).toLowerCase()}.\nЭта и все следующие серии сдвинутся на следующий день выхода. Продолжить?`)) return;
  s.overrides = s.overrides || {};
  let date = e.date;
  if (s.overrides[n]) { // у серии уже был перенос: считаем от даты по графику
    const copy = { ...s, overrides: { ...s.overrides } }; delete copy.overrides[n];
    date = generateEpisodes(copy).find(x => x.n == n).date; delete s.overrides[n];
  }
  if (date === s.startDate) s.startDate = nextReleaseDate(s, date);
  else s.skipDates = [...new Set([...(s.skipDates || []), date])].sort();
  markDirty(); renderAll();
}
let mvTarget = null;
function openMove(id, n) {
  const { s, e } = epOf(id, n); mvTarget = { id, n };
  $('mvTitle').textContent = `${s.title}, серия ${n}`;
  $('mvDate').value = e.date; $('mvTime').value = e.time || s.time;
  $('mvReset').hidden = !(s.overrides && s.overrides[n]);
  $('mv').showModal();
}
$('mvCancel').onclick = () => $('mv').close();
$('mvf').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const s = shows.find(x => x.id === mvTarget.id); s.overrides = s.overrides || {};
  s.overrides[mvTarget.n] = $('mvDate').value + ' ' + $('mvTime').value;
  $('mv').close(); markDirty(); renderAll();
});
$('mvReset').onclick = () => {
  const s = shows.find(x => x.id === mvTarget.id); delete s.overrides[mvTarget.n];
  $('mv').close(); markDirty(); renderAll();
};
function onEpClick(ev) {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.skip) { const [id, n] = b.dataset.skip.split('|'); skipEpisode(id, n); }
  if (b.dataset.move) { const [id, n] = b.dataset.move.split('|'); openMove(id, n); }
}
$('upcoming').addEventListener('click', onEpClick);
$('hero').addEventListener('click', onEpClick);

$('list').addEventListener('click', (ev) => {
  const e = ev.target.dataset.e, d = ev.target.dataset.d;
  if (ev.target.dataset.us) { const [id, date] = ev.target.dataset.us.split('|'); const s = shows.find(x => x.id === id); s.skipDates = (s.skipDates || []).filter(x => x !== date); markDirty(); renderAll(); }
  if (ev.target.dataset.uo) { const [id, n] = ev.target.dataset.uo.split('|'); const s = shows.find(x => x.id === id); delete s.overrides[n]; markDirty(); renderAll(); }
  if (e) startEdit(e);
  if (d && confirm('Удалить сериал? Его серии пропадут из календаря после сохранения.')) { shows = shows.filter(s => s.id !== d); markDirty(); renderAll(); }
});
function startEdit(id) {
  const s = shows.find(x => x.id === id); resetForm(); editing = id;
  $('title').value = s.title; $('mdl').value = s.mdlUrl || ''; $('atv').value = s.asiantvUrl || '';
  $('start').value = s.startDate; $('time').value = s.time; $('total').value = s.totalEpisodes;
  $('batch').value = s.premiereBatch || 1; $('perday').value = s.perDay || 1;
  document.querySelectorAll('#days input').forEach(i => i.checked = (s.weekdays || []).includes(+i.value));
  $('skip').value = (s.skipDates || []).join('\n');
  $('ovr').value = Object.entries(s.overrides || {}).map(([k, v]) => k + ' ' + v).join('\n');
  $('formTitle').textContent = 'Изменить сериал'; $('saveBtn').textContent = 'Сохранить изменения';
  renderPreview(); $('dlg').showModal();
}
$('f').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const s = readForm(), i = shows.findIndex(x => x.id === s.id);
  if (i >= 0) shows[i] = s; else shows.push(s);
  $('dlg').close(); markDirty(); renderAll();
});

// ---------- сохранение ----------
function setStatus(t, cls) { $('status').innerHTML = cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t); }
function markDirty() {
  dirty = true; ls.set('draft', JSON.stringify({ shows }));
  $('savebar').hidden = false; setStatus('Есть несохранённые изменения');
}
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
$('ghSave').onclick = () => { ls.set('ghRepo', $('ghRepo').value.trim()); ls.set('ghToken', $('ghToken').value.trim()); $('cfgStatus').textContent = 'Настройки запомнены.'; };
$('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ shows }, null, 2)], { type: 'application/json' }));
  a.download = 'shows.json'; a.click();
};
$('pushBtn').onclick = async () => {
  const repo = ls.get('ghRepo'), token = ls.get('ghToken');
  if (!repo || !token) { $('savebar').hidden = false; return setStatus('Сначала заполните настройки сохранения внизу страницы.', 'bad'); }
  setStatus('Сохраняю…');
  try {
    const h = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' };
    const putFile = async (path, text) => {
      const url = `https://api.github.com/repos/${repo}/contents/${path}`;
      const cur = await fetch(url, { headers: h });
      const sha = cur.ok ? (await cur.json()).sha : undefined;
      const bytes = new TextEncoder().encode(text);
      let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
      const r = await fetch(url, { method: 'PUT', headers: h, body: JSON.stringify({ message: 'Обновлён ' + path, sha, content: btoa(bin) }) });
      if (!r.ok) throw new Error((await r.json()).message || r.status);
    };
    await putFile('shows.json', JSON.stringify({ shows }, null, 2));
    await putFile('calendar.ics', DramaLib.buildICS(shows));
    dirty = false; ls.set('draft', '');
    setStatus('Сохранено. Календарь обновится в течение пары минут.', 'ok');
    setTimeout(() => { if (!dirty) $('savebar').hidden = true; }, 6000);
  } catch (e) { setStatus('Не удалось сохранить: ' + e.message, 'bad'); }
};

// ---------- старт ----------
(async function init() {
  renderSub();
  try { const r = await fetch('shows.json?' + Date.now()); if (r.ok) shows = (await r.json()).shows || []; } catch {}
  const draft = ls.get('draft');
  if (draft) {
    try {
      const d = JSON.parse(draft).shows;
      if (d && confirm('Найдены несохранённые изменения с прошлого раза. Восстановить?')) { shows = d; markDirty(); }
      else ls.set('draft', '');
    } catch {}
  }
  renderAll(); renderPreview();
})();
</script>
</body>
