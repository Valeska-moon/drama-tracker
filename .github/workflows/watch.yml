name: Слежка за сериями
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверить сайт
        run: node watch.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Сохранить состояние
        run: |
          git config user.name "drama-tracker"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Состояние слежки" && git pull --rebase -q && git push)
      # Расписание GitHub (cron) для этого репозитория не срабатывает, поэтому каждый запуск через 13 минут запускает следующий сам.
      # Если цепочка когда-нибудь оборвётся, достаточно один раз нажать «Run workflow».
      - name: Запустить следующую проверку
        if: always()
        run: |
          sleep 780
          gh workflow run watch.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
